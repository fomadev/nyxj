name: Build NyxJ Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            suffix: linux-x64
            cc: gcc
          - os: ubuntu-latest
            arch: arm64
            suffix: linux-arm64
            cc: aarch64-linux-gnu-gcc
          - os: windows-latest
            arch: x64
            suffix: windows-x64
            cc: gcc
          - os: macos-latest
            arch: arm64
            suffix: macos-arm64
            cc: clang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Create Build Directory
        run: mkdir -p dist

      # --- UNIFIED COMPILATION LOGIC ---
      
      - name: Compile Core Server
        shell: bash
        run: |
          EXE_EXT=$([[ "${{ runner.os }}" == "Windows" ]] && echo ".exe" || echo "")
          ${{ matrix.cc }} src/server.c src/core/parser.c vendor/mongoose/mongoose.c \
            -Iinclude -Ivendor/mongoose \
            -o dist/nyxj-server-${{ matrix.suffix }}${EXE_EXT} \
            $([[ "${{ runner.os }}" == "Windows" ]] && echo "-lws2_32" || echo "-lpthread -ldl")

      - name: Compile API Example
        shell: bash
        run: |
          EXE_EXT=$([[ "${{ runner.os }}" == "Windows" ]] && echo ".exe" || echo "")
          ${{ matrix.cc }} examples/api_example/api_example.c src/core/parser.c vendor/mongoose/mongoose.c \
            -Iinclude -Ivendor/mongoose \
            -o dist/example-api-${{ matrix.suffix }}${EXE_EXT} \
            $([[ "${{ runner.os }}" == "Windows" ]] && echo "-lws2_32" || echo "-lpthread -ldl")

      - name: Compile Client Test Example
        shell: bash
        run: |
          EXE_EXT=$([[ "${{ runner.os }}" == "Windows" ]] && echo ".exe" || echo "")
          ${{ matrix.cc }} examples/client_test/client_test.c src/core/parser.c vendor/mongoose/mongoose.c \
            -Iinclude -Ivendor/mongoose \
            -o dist/example-client-${{ matrix.suffix }}${EXE_EXT} \
            $([[ "${{ runner.os }}" == "Windows" ]] && echo "-lws2_32" || echo "-lpthread -ldl")

      # --- PACKAGING ---

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: nyxj-binaries-${{ matrix.suffix }}
          path: dist/*