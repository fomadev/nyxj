name: Build NyxJ Multi-Platform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            suffix: linux-x64
          - os: ubuntu-latest
            arch: arm64
            suffix: linux-arm64
          - os: windows-latest
            arch: x64
            suffix: windows-x64
          - os: macos-latest
            arch: arm64
            suffix: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      # --- COMPILATION STEP --- 

      - name: Build All (Windows)
        if: runner.os == 'Windows'
        run: |
          gcc src/server.c src/core/parser.c vendor/mongoose/mongoose.c -Iinclude -Ivendor/mongoose -o nyxj-windows-x64.exe -lws2_32
          cd examples/api_example && gcc api_example.c ../../src/core/parser.c ../../vendor/mongoose/mongoose.c -I../../include -I../../vendor/mongoose -o example-api_example-windows-x64.exe -lws2_32
          cd ../client_test && gcc client_test.c ../../src/core/parser.c ../../vendor/mongoose/mongoose.c -I../../include -I../../vendor/mongoose -o example-client_test-windows-x64.exe -lws2_32

      - name: Build All (Linux x64)
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          gcc src/server.c src/core/parser.c vendor/mongoose/mongoose.c -Iinclude -Ivendor/mongoose -o nyxj-linux-x64 -lpthread
          cd examples/api_example && make && mv api_example example-api_example-linux-x64
          cd ../client_test && make && mv client_test example-client_test-linux-x64

      - name: Build All (Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          aarch64-linux-gnu-gcc src/server.c src/core/parser.c vendor/mongoose/mongoose.c -Iinclude -Ivendor/mongoose -o nyxj-linux-arm64 -lpthread
          # Pour les exemples en ARM64, on utilise le compilateur croisé directement
          cd examples/api_example && aarch64-linux-gnu-gcc api_example.c ../../src/core/parser.c ../../vendor/mongoose/mongoose.c -I../../include -I../../vendor/mongoose -o example-api_example-linux-arm64 -lpthread
          cd ../client_test && aarch64-linux-gnu-gcc client_test.c ../../src/core/parser.c ../../vendor/mongoose/mongoose.c -I../../include -I../../vendor/mongoose -o example-client_test-linux-arm64 -lpthread

      - name: Build All (macOS)
        if: runner.os == 'macOS'
        run: |
          gcc src/server.c src/core/parser.c vendor/mongoose/mongoose.c -Iinclude -Ivendor/mongoose -o nyxj-macos-arm64
          cd examples/api_example && make && mv api_example example-api_example-macos-arm64
          cd ../client_test && make && mv client_test example-client_test-macos-arm64

      # --- FILE ORGANIZATION ---

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p output
          # On déplace tout ce qui a été compilé vers le dossier output
          find . -name "nyxj-*" -exec cp {} output/ \;
          find . -name "example-*" -exec cp {} output/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaires-${{ matrix.suffix }}
          path: output/*