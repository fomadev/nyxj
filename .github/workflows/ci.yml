name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unix:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make -j4 all

      - name: Unit and integration tests
        run: make test

      - name: End-to-end smoke test
        run: bash tests/smoke.sh build

  windows:
    name: Test (windows-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make curl mingw-w64-ucrt-x86_64-gcc

      - name: Build
        run: make -j4 all

      - name: Unit and integration tests
        run: make test

      - name: End-to-end smoke test
        run: bash tests/smoke.sh build

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Build and test with sanitizers
        run: make -j4 SAN=1 test

      - name: Replay the fuzz corpus with sanitizers
        run: make SAN=1 fuzz-replay

  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Test suite under Valgrind
        run: make -j4 OPT="-O1 -g" valgrind

  fuzz:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the fuzzers
        run: make fuzz FUZZ_CC=clang

      - name: Fuzz every target
        run: make fuzz-run FUZZ_CC=clang FUZZ_TIME=20

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build/fuzz/crash_*
          if-no-files-found: ignore

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standard datasets (twitter, canada, citm_catalog)
        run: make -j4 bench BENCH_ITER=20

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: make wasm

      - name: Node.js smoke test
        run: node examples/wasm/smoke.cjs
